<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angjelo's Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #6200ea;
            color: white;
            padding: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin: 1.5rem 0;
        }
        a {
            display: inline-block;
            margin-top: 2rem;
            text-decoration: none;
            color: white;
            background-color: #6200ea;
            padding: 1rem 2rem;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: background-color 0.3s, transform 0.3s;
        }
        a:hover {
            background-color: #3700b3;
            transform: translateY(-5px);
        }
        a:active {
            background-color: #6200ea;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Angjelo's Website</h1>
    </header>
    <p>Hello, my name is Angjelo, and this is my website.</p>
    <!-- "Open My Texts" Link -->
    <a href="mytexts.html">Open My Texts</a>
    <!-- "My Gallery" Link placed below the previous link -->
    <a href="gallery.html">My Gallery</a>
</body>
</html>
