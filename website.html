<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angjelo's Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #6200ea;
            color: white;
            padding: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin: 1.5rem 0;
        }
        button {
            background-color: #6200ea;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #3700b3;
        }
        img {
            margin: 2rem 0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        a {
            display: inline-block;
            margin-top: 2rem;
            text-decoration: none;
            color: #6200ea;
            font-weight: bold;
            font-size: 1.2rem;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Angjelo's Website</h1>
    </header>
    <p>Hello, my name is Angjelo, and this is my website. Check out my bike below!</p>
    <button>COOL</button>
    <div>
        <img src="https://imgur.com/M1Wf3AM.png" alt="Imgur Image" width="300">
    </div>
    <a href="mytexts.html">Open My Texts</a>
</body>
</html>
