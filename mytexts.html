<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        ol {
            list-style: none;
            padding: 0;
            margin: 20px;
        }
        ol li {
            margin: 10px 0;
        }
        a {
            display: block;
            text-decoration: none;
            font-size: 18px; /* Adjust font size for readability */
            color: #007BFF;
            padding: 10px;
            border: 1px solid #ddd; /* Add border for touch area */
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        a:hover, a:focus {
            background-color: #007BFF;
            color: #fff;
            outline: none; /* Remove outline for a cleaner look */
        }
    </style>
</head>
<body>
    <ol>
        <li><a href="ΟΙ ΔΥΟ ΣΦΑΙΡΕΣ.html">ΟΙ ΔΥΟ ΣΦΑΙΡΕΣ</a></li>
        <li><a href="Ουδέν Νεώτερον από το Δυτικό Μέτωπο.html">Ουδέν Νεώτερον από το Δυτικό Μέτωπο</a></li>
    </ol>
</body>
</html>
