<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            background-image: url('https://i.pinimg.com/236x/25/6f/6d/256f6d87044789ff31f3b6e6e13c08e0.jpg');
            background-size: cover; /* Ensures the image covers the entire background */
            background-repeat: no-repeat; /* Prevents the image from repeating */
            background-attachment: fixed; /* Keeps the image fixed during scroll */
            background-position: center; /* Centers the background image */
            color: #fff; /* Makes text readable against the background */
        }
        ol {
            list-style: none;
            padding: 0;
            margin: 20px;
        }
        ol li {
            margin: 10px 0;
        }
        a {
            display: block;
            text-decoration: none;
            font-size: 18px; /* Adjust font size for readability */
            color: #007BFF;
            padding: 10px;
            background: rgba(255, 255, 255, 0.8); /* Semi-transparent background for contrast */
            border: 1px solid #ddd; /* Add border for touch area */
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        a:hover, a:focus {
            background-color: #007BFF;
            color: #fff;
            outline: none; /* Remove outline for a cleaner look */
        }
    </style>
</head>
<body>
    <ol>
        <li><a href="ΟΙ ΔΥΟ ΣΦΑΙΡΕΣ.html">ΟΙ ΔΥΟ ΣΦΑΙΡΕΣ</a></li>
        <li><a href="Ουδέν Νεώτερον από το Δυτικό Μέτωπο.html">Ουδέν Νεώτερον από το Δυτικό Μέτωπο</a></li>
        <li><a href="Ελευθεριος Βενιζελος.html">Ελευθέριος Βενιζέλος</a></li>
        <li><a href="Η Γενναιότητα του Ελληνικού Λαού στον Β' Παγκόσμιο Πόλεμο.html">Η Γενναιότητα του Ελληνικού Λαού στον Β' Παγκόσμιο Πόλεμο</a></li>
        <li><a href="Enver Hoxha.html">Η επίσκεψη του Ενβέρ Χότζα στη Μόσχα το 1947</a></li>
    </ol>
</body>
</html>
