<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #f4f4f4;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .gallery-item {
            position: relative;
            width: 100%;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            opacity: 0.9;
        }

        .caption {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .gallery-item:hover .caption {
            display: block;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        /* Lightbox styles */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .lightbox:target {
            display: flex;
        }
    </style>
</head>
<body>
    <h1>My Gallery</h1>
    <div class="gallery">
        <div class="gallery-item">
            <a href="#lightbox1">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/043/032/629/small/a-spring-lake-surrounded-by-blooming-cherry-blossoms-photo.jpg" alt="Spring Lake with Cherry Blossoms">
            </a>
            <div id="lightbox1" class="lightbox">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/043/032/629/small/a-spring-lake-surrounded-by-blooming-cherry-blossoms-photo.jpg" alt="Spring Lake with Cherry Blossoms">
            </div>
            <div class="caption">Spring Lake with Cherry Blossoms</div>
        </div>
        <div class="gallery-item">
            <a href="#lightbox2">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGUUwWS-phSbt9Wk3t-qZRXK5iQQ9WJ3AbVw&s.jpg" alt="Image 2">
            </a>
            <div id="lightbox2" class="lightbox">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGUUwWS-phSbt9Wk3t-qZRXK5iQQ9WJ3AbVw&s.jpg" alt="Image 2">
            </div>
            <div class="caption">Stunning Landscape</div>
        </div>
        <div class="gallery-item">
            <a href="#lightbox3">
                <img src="https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885_1280.jpg" alt="Lone Tree">
            </a>
            <div id="lightbox3" class="lightbox">
                <img src="https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885_1280.jpg" alt="Lone Tree">
            </div>
            <div class="caption">Lone Tree at Sunset</div>
        </div>
    </div>
</body>
</html>
